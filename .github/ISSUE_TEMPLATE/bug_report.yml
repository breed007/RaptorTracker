name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. For a security problem, please don't use this form; see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer of every page, for example "v1.0.0 · 2026-10-05".
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it's installed
      options:
        - Docker / Docker Compose
        - install.sh on a Linux server
        - From source (npm start / npm run dev)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The machine and OS, for example "Raspberry Pi 4, Raspberry Pi OS 64-bit" or "Ubuntu 24.04 VM".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: |
        Anything relevant from `docker logs raptortracker` or `pm2 logs raptortracker`. Check it for anything private before posting.
      render: text

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Several pushes in a row should produce one verdict, not one per commit.
# A newer push cancels the run still churning on the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: ubuntu-latest
          # Native ARM64 Linux — the same architecture as a Raspberry Pi 4/5
          # on 64-bit Raspberry Pi OS. Not emulated.
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags are the fixtures for the upgrade tests

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install server dependencies
        run: npm ci

      - name: Smoke test (schema, migrations, module load)
        run: npm test

      - name: API tests (routes, auth, cross-record behavior)
        run: npm run test:api

      # Needs full history: it rebuilds each released tag's schema and migrates
      # it forward, so a shallow clone would find no tags to test against.
      - name: Upgrade tests (every released tag -> HEAD)
        run: npm run test:upgrade

      # Boots the real server and attacks it: decompression bombs, path
      # traversal, symlinks, smuggled script files, unauthenticated uploads,
      # stale sessions. Builds its hostile archives with python3.
      - name: Security tests
        run: npm run test:security

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build frontend
        run: npm run build

      - name: Confirm PWA assets are in the build
        run: |
          set -e
          for f in dist/index.html dist/manifest.webmanifest dist/sw.js dist/icon.svg; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "build output looks complete"

  e2e:
    name: end-to-end (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Builds the client, starts the real server on a throwaway database,
      # and drives it like an owner: first run, logging, mods and AUX, delete
      # and Undo, units, reports, keyboard dialogs, and an axe WCAG 2.1 AA scan
      # of the main pages in light and dark mode.
      - name: Playwright tests
        run: npm run test:e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Build the image from a clean checkout
        run: docker build -t raptortracker:ci .

      - name: Refuses to start on placeholder secrets
        run: |
          set +e
          docker run --rm -e SESSION_SECRET=changeme_in_production \
            -e ADMIN_PASSWORD=changeme_in_production raptortracker:ci > out.log 2>&1
          code=$?
          cat out.log
          if [ "$code" -eq 0 ]; then echo "container started on placeholder secrets"; exit 1; fi
          grep -q "refusing to start" out.log

      - name: Boots and passes its health check
        run: |
          docker run -d --name rt -p 3000:3000 \
            -e SESSION_SECRET="$(openssl rand -hex 48)" \
            -e ADMIN_PASSWORD="ci-$(openssl rand -hex 12)" \
            raptortracker:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' rt)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs rt
          [ "$(docker inspect -f '{{.State.Health.Status}}' rt)" = "healthy" ]
          curl -fsS http://localhost:3000/api/health
          echo
          curl -fsS -o /dev/null http://localhost:3000/
